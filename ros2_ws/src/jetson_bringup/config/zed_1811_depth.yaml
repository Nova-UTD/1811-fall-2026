# Same image settings as zed_1811.yaml, with depth enabled for selected cameras.
/**:
  ros__parameters:
    general:
      grab_resolution: 'HD1200'
      grab_frame_rate: 15
      pub_resolution: 'CUSTOM'
      pub_downscale_factor: 2.0
      pub_frame_rate: 10.0
    depth:
      depth_mode: 'NEURAL_LIGHT'
      depth_stabilization: 0
      publish_point_cloud: true
      point_cloud_freq: 5.0
      point_cloud_res: 'REDUCED'
    pos_tracking:
      pos_tracking_enabled: false
