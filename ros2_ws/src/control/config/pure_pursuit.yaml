# Default pure_pursuit_node params. Values with a TODO below are
# placeholders, not measurements -- see README.md before driving for real.
/**:
  ros__parameters:
    lookahead_distance: 0.25       # m -- base Ld; tune on blocks first
    lookahead_speed_gain: 0.0      # m per m/s of speed; 0 = fixed Ld
    min_lookahead: 0.2             # m -- must stay <= lookahead_distance or it silently wins the clamp
    max_lookahead: 3.0             # m
    closest_index_window: 5        # points; how far ahead of last_idx to search each tick
    wheelbase: 0.937               # m -- measured, vehicle_1811.urdf.xacro
    max_steer_angle: 0.35          # rad -- TODO-MEASURE off the chassis (see README)
    steer_sign: 1.0                # flip to -1.0 if wheels steer away from the path
    target_speed_mps: 0.9          # ~2 mph, the guide's recommended first-drive speed
    max_speed_mps: 5.588           # 12.5 mph -- MUST match serial_bridge_node's MAX_SPEED_MPH
    curvature_speed_gain: 0.0      # 0 = constant target_speed_mps
    min_speed_mps: 0.4
    goal_tolerance: 0.3            # m
    path_file: ''                  # set to a CSV to bench-test without route_publisher
    path_topic: '/planning/path'
    odom_topic: '/odometry'
    cmd_topic: '/cmd/auto'
    control_rate: 30.0             # Hz
    odom_timeout: 0.5              # s -- publish zero if odometry is older than this
