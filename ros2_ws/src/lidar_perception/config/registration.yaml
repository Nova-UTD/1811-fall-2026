# Loaded when the Jetson starts lidar_camera_registration.launch.py.
# Edit these values, then restart the registration node. Distances are in meters.
lidar_camera_registration:
  ros__parameters:
    # Calibrate promptly when data arrives, then re-align at this interval.
    # Example: with a 5 s interval, an attempt starting at 15 s is followed no earlier than 20 s.
    calibration_interval_s: 5.0       # Seconds between registration attempts.
    # Example: ignore a cloud received more than 2 s ago, even if its timestamp is valid.
    max_cloud_age_s: 2.0               # Maximum age since this node received a cloud.

    # Point-cloud resolution: smaller voxels keep more detail but need more CPU.
    # Example: points in a 5 cm voxel are represented by one averaged point for ICP.
    icp_voxel_size_m: 0.05             # ICP and the published cloud: 5 cm.
    # Example: a 10 cm voxel produces a coarser cloud for faster feature matching.
    fpfh_voxel_size_m: 0.10            # Feature matching: 10 cm.

    # Search distances are multiples of fpfh_voxel_size_m.
    # Example: 2.0 * 0.10 m = 0.20 m search radius to estimate surface normals.
    fpfh_normal_radius_multiplier: 2.0
    # Example: 5.0 * 0.10 m = 0.50 m search radius for the FPFH shape descriptor.
    fpfh_feature_radius_multiplier: 5.0
    # Example: 2.0 * 0.10 m = 0.20 m maximum correspondence distance for RANSAC.
    ransac_max_distance_multiplier: 2.0

    # RANSAC finds an initial camera-to-LiDAR pose from matching geometry.
    # Example: try at most 100000 random samples; RANSAC may stop earlier.
    ransac_max_iterations: 100000       # More attempts can take more CPU time.
    # Example: 0.999 requests 99.9% sampling confidence; 1.0 disables early stopping.
    # This confidence does not guarantee the resulting pose is correct.
    ransac_confidence: 0.999            # Higher confidence can take more attempts; max 1.0.
    # Example: 40 matches out of 400 camera points give fitness 0.10.
    # The match count must also satisfy min_points.
    ransac_min_fitness: 0.15            # Minimum matched fraction of camera points, 0.0 to 1.0.

    # ICP refines that pose and checks whether the result is usable.
    # Example: a camera point 0.20 m from the nearest LiDAR point is ignored.
    icp_max_distance_m: 0.15            # Largest distance between matched points.
    # Example: a limit of 20 permits at most 20 iterations; convergence may stop it sooner.
    icp_max_iterations: 30
    # Example: reject a downsampled cloud with 29 points or a result with 29 matches.
    min_points: 30                      # Minimum cloud points and matches for RANSAC and ICP.
    # Example: 36 matches out of 400 camera points give 0.09, below the 0.10 minimum.
    icp_min_fitness: 0.10               # Minimum matched fraction of camera points, 0.0 to 1.0.
    # Example: 0.12 m RMSE is rejected by this 0.08 m limit, even if fitness passes.
    icp_max_rmse_m: 0.08                # Maximum root-mean-square error among matched points.
    # Example: a camera estimated 4 m from the LiDAR is outside this vehicle's 3 m limit.
    # This broad limit is not an initial camera pose; increase it if the rig is larger.
    max_camera_lidar_distance_m: 3.0
    # Example: an ICP correction of 0.60 m from the starting position is rejected.
    icp_max_translation_m: 0.50         # Reject a larger position change from the starting pose.
    # Example: an ICP orientation correction of 16 degrees is rejected.
    icp_max_rotation_deg: 15.0          # Reject a larger orientation change from the starting pose.
    # Example: after 3 failed ICP attempts using a cached pose, retry FPFH/RANSAC next time.
    max_icp_failures: 3                 # Retry RANSAC after this many consecutive cached-pose failures.

    # Confirm a new global pose across separate scans before publishing TF or the URDF.
    # Example: 1/3 and 2/3 are still provisional; 3/3 agreeing estimates can be accepted.
    initial_pose_confirmations: 3
    # Example: estimates 0.08 m apart do not agree within this 0.05 m limit.
    pose_agreement_translation_m: 0.05
    # Example: estimates 4 degrees apart do not agree within this 3 degree limit.
    # The same translation and rotation limits prevent later ICP updates from drifting
    # far from the confirmed pose. They do not use manual camera measurements.
    pose_agreement_rotation_deg: 3.0

    # Pair only scans captured close together; both sensors must use the same time base.
    # Example: timestamps 100.00 s and 100.40 s differ by 0.40 s, so the pair is rejected.
    max_camera_time_difference_s: 0.30

    # Colors for points in /lidar_perception/registered_points, as [red, green, blue] in 0-255.
    # In RViz, select the registered display's RGB8 color transformer to see these colors.
    # Example: [230, 230, 230] makes the registered LiDAR points light gray.
    lidar_rgb: [230, 230, 230]
    # Example: [40, 160, 255] makes front-camera points blue.
    front_rgb: [40, 160, 255]
    # Example: [50, 220, 80] makes left-camera points green.
    left_rgb: [50, 220, 80]
    # Example: [255, 160, 40] makes rear-camera points orange.
    rear_rgb: [255, 160, 40]
    # Example: [240, 70, 210] makes right-camera points magenta.
    right_rgb: [240, 70, 210]
